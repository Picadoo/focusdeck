# 一键部署：docker compose up -d --build
# 不需要先建 .env，也不需要先算密码哈希 —— 首次启动会自己生成密钥和初始密码，
# 密码打印在 docker compose logs 里，并连同 JWT 密钥一起持久化到 focusdeck-data 卷。

services:
  focusdeck:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 同源部署留空即可；前后端分家时填 API 的对外地址。
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: focusdeck:local
    container_name: ${CONTAINER_NAME:-focusdeck}
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT:-512m}
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/focusdeck.db
      STATIC_DIR: /app/public
      FOCUSDECK_USER: ${FOCUSDECK_USER:-focus}
      # 下面三个都可以不填。填了以环境变量为准，不填则用数据卷里自举出来的。
      FOCUSDECK_PASSWORD: ${FOCUSDECK_PASSWORD:-}
      FOCUSDECK_PASSWORD_HASH: ${FOCUSDECK_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - focusdeck-data:/data
    ports:
      # 默认只绑回环，套 nginx/caddy 反代再对外。要直接暴露就把 BIND 设成 0.0.0.0。
      - "${BIND:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  focusdeck-data:
