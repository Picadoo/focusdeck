[package]
name = "focusdeck-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "FocusDeck native desktop, rendered by GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
