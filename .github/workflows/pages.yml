name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    # README / 会话日志之类的改动不必重新发一次演示站
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最后一次部署；排队中的旧的直接丢掉，但不打断正在发布的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc -b

      # Pages 把站点放在 /focusdeck/ 子路径下，资源引用必须带这个前缀。
      # 只在这里用 CLI 覆盖，不写进 vite.config.ts —— 安卓 (capacitor://localhost)
      # 和自托管服务端都是从根路径发的，base 写死会把那两条线弄坏。
      - run: pnpm exec vite build --base=/focusdeck/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
