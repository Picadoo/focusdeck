name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 鍚屼竴鍒嗘敮涓婂悗鎺ㄧ殑鎻愪氦鍙栨秷鍓嶄竴娆℃湭璺戝畬鐨勶紝閬垮厤杩炴帹鍑犳鏃舵帓闃熸氮璐归搴?
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 鍓嶇锛堢被鍨?/ lint / 鍗曟祴 / 鏋勫缓锛?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # build 鑴氭湰鏈韩鏄?`tsc -b && vite build`锛岀被鍨嬫鏌ュ寘鍚湪鍐?
      - run: pnpm build

      - name: i18n 瑕嗙洊鐜囷紙鏈蛋 t() 鐨勪腑鏂囧瓧闈㈤噺蹇呴』涓?0锛?
        run: node scripts/i18n-scan.mjs

  server:
    name: 鏈嶅姟绔紙缂栬瘧锛?
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # server/ 鏄嫭绔嬪瓙宸ョ▼锛岃蛋鑷繁鐨?package-lock.json 鑰屼笉鏄牴鐩綍鐨?pnpm
      - run: npm ci

      - run: npm run build
